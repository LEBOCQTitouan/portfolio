name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. new push to a PR)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # End-to-end guard that Next actually loads the locale proxy in a real
      # server. The unit tests pass even if the proxy file is misplaced, so this
      # is the layer that catches a `middleware`/`proxy` rename or wrong-location
      # regression 404-ing every un-prefixed route in production.
      - name: Routing smoke test (proxy → locale redirect)
        run: |
          npm run start &
          server_pid=$!
          trap "kill $server_pid 2>/dev/null || true" EXIT
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/en && break
            sleep 1
          done
          check() {
            loc=$(curl -s -o /dev/null -w '%{redirect_url}' "http://localhost:3000$1")
            if [ "$loc" != "$2" ]; then
              echo "FAIL: $1 redirected to '$loc', expected '$2'"
              exit 1
            fi
            echo "OK: $1 -> $loc"
          }
          check / http://localhost:3000/en
          check /work http://localhost:3000/en/work

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    # Only deploy on a push to main (i.e. after a PR merges), never on PRs,
    # and only if the verify job passed. Production can never ship red.
    # Opt-in: set repo variable CLOUDFLARE_DEPLOY=true once the
    # CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets are configured,
    # so merging stays green until deploys are intentionally enabled.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (OpenNext → Cloudflare)
        run: npx opennextjs-cloudflare build
        # NEXT_PUBLIC_* vars are inlined at build time, so the beacon token must
        # be present here (set repo variable NEXT_PUBLIC_CF_BEACON_TOKEN).
        env:
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.NEXT_PUBLIC_CF_BEACON_TOKEN }}
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
